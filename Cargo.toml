[package]
name = "rcsharp"
version = "0.1.0"
edition = "2021"

[workspace]
resolver = "3"
members = ["rcsharp_lexer", "rcsharp_parser", "rcsharp_syntax"]

[dependencies]
rcsharp_syntax = { path = "./rcsharp_syntax" }
rcsharp_lexer = { path = "./rcsharp_lexer" }
rcsharp_parser = { path = "./rcsharp_parser" }
clap = { version = "4.6.1", features = ["derive"] }
